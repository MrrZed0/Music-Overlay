<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music Overlay Customizer Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d13;
    --panel: #131722;
    --panel-border: #22293e;
    --accent: #00f2fe;
    --accent-2: #4facfe;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --danger: #f43f5e;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 440px 1fr;
  }

  @media (max-width: 1024px) {
    body { grid-template-columns: 1fr; }
  }

  /* Left Control Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    height: 100vh;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .brand-header h1 {
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    background: #0b0e17;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  input:focus, select:focus {
    border-color: var(--accent);
  }

  input[type="color"] {
    width: 100%;
    height: 36px;
    background: #0b0e17;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    cursor: pointer;
    padding: 2px;
  }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #060911;
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.2s ease;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: scale(0.98); }

  .btn-secondary {
    background: #1e2538;
    color: var(--text);
    border: 1px solid #2e3852;
  }

  /* Blocked Executables Tag Chips */
  .exe-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .exe-chip {
    background: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.45);
    color: #fda4af;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .exe-chip button {
    background: none;
    border: none;
    color: #fda4af;
    cursor: pointer;
    font-weight: 800;
    font-size: 13px;
  }

  .preset-exes {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 4px;
  }
  .preset-btn {
    background: #181e2e;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
  }
  .preset-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /* Right Preview Stage */
  .preview-pane {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 24px;
    gap: 18px;
  }

  .preview-toolbar {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .preview-canvas {
    flex: 1;
    background:
      radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(79, 172, 254, 0.08), transparent 40%),
      repeating-conic-gradient(#121621 0% 25%, #0d1018 0% 50%) 50% / 28px 28px;
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .preview-canvas iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .url-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .url-row {
    display: flex;
    gap: 10px;
  }
  .url-row input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
</style>
</head>
<body>

  <!-- Left Customizer Controls -->
  <aside class="sidebar">
    <div class="brand-header">
      <h1>Overlay Customizer Studio</h1>
      <button class="btn btn-secondary" onclick="resetDefaults()">Reset</button>
    </div>

    <!-- 1. 108+ In/Out Visibility Effects -->
    <div class="card">
      <div class="card-title">
        <span>1. 108 In / Out Visibility Effects</span>
        <span>(10s Idle Hide)</span>
      </div>

      <div class="field">
        <label>Show Player (In Effect — 108 Options)</label>
        <div class="url-row">
          <select id="inEffect" onchange="saveAndSync()"></select>
          <button class="btn" onclick="testEffect('TEST_IN_EFFECT', 'inEffect')">Test In</button>
        </div>
      </div>

      <div class="field">
        <label>Hide Player (Out Effect — 108 Options)</label>
        <div class="url-row">
          <select id="outEffect" onchange="saveAndSync()"></select>
          <button class="btn btn-secondary" onclick="testEffect('TEST_OUT_EFFECT', 'outEffect')">Test Out</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Auto-Hide Delay (Seconds)</label>
          <input type="number" id="hideDelaySec" min="1" max="120" value="10" onchange="saveAndSync()" />
        </div>
        <div class="field">
          <label>Transition Speed (ms)</label>
          <input type="number" id="animDuration" min="200" max="2500" step="50" value="750" onchange="saveAndSync()" />
        </div>
      </div>
    </div>

    <!-- 2. 108+ Song-Change 10s Splash Takeover Effects -->
    <div class="card">
      <div class="card-title">
        <span>2. 108 Song-Change Takeover Effects</span>
        <span>(10s Cover)</span>
      </div>

      <div class="field">
        <label>Splash Takeover In-Effect (108 Options)</label>
        <div class="url-row">
          <select id="splashInEffect" onchange="saveAndSync()"></select>
          <button class="btn" onclick="testEffect('TEST_SPLASH_EFFECT', 'splashInEffect')">Test 10s Splash</button>
        </div>
      </div>

      <div class="field">
        <label>Splash Takeover Exit-Effect (108 Options)</label>
        <select id="splashOutEffect" onchange="saveAndSync()"></select>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Cover Duration (Seconds)</label>
          <input type="number" id="splashDurationSec" min="3" max="30" value="10" onchange="saveAndSync()" />
        </div>
        <div class="field">
          <label>Enable 10s Song Takeover</label>
          <select id="enableSplash" onchange="saveAndSync()">
            <option value="true">Enabled (Covers for 10s)</option>
            <option value="false">Disabled</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 3. Blocked Program File Names (.exe Filter) -->
    <div class="card">
      <div class="card-title">
        <span>3. Blocked Programs (.exe Filter)</span>
      </div>
      <label>Ignore audio from these programs (SMTC Bridge):</label>
      <div class="exe-tags" id="exe-tags-container"></div>

      <div class="url-row">
        <input type="text" id="new-exe-input" placeholder="e.g. chrome.exe or vlc.exe" onkeydown="if(event.key==='Enter') addBlockedExe()" />
        <button class="btn" onclick="addBlockedExe()">+ Block</button>
      </div>

      <div class="preset-exes">
        <button class="preset-btn" onclick="quickAddExe('chrome.exe')">+ chrome.exe</button>
        <button class="preset-btn" onclick="quickAddExe('msedge.exe')">+ msedge.exe</button>
        <button class="preset-btn" onclick="quickAddExe('firefox.exe')">+ firefox.exe</button>
        <button class="preset-btn" onclick="quickAddExe('brave.exe')">+ brave.exe</button>
        <button class="preset-btn" onclick="quickAddExe('discord.exe')">+ discord.exe</button>
        <button class="preset-btn" onclick="quickAddExe('vlc.exe')">+ vlc.exe</button>
        <button class="preset-btn" onclick="quickAddExe('obs64.exe')">+ obs64.exe</button>
      </div>
    </div>

    <!-- 4. Player Look, Theme & Colors -->
    <div class="card">
      <div class="card-title"><span>4. Player Theme & Appearance</span></div>

      <div class="field-row">
        <div class="field">
          <label>Player Layout Theme</label>
          <select id="theme" onchange="saveAndSync()">
            <option value="glass">Glassmorphic Card</option>
            <option value="cyberpunk">Cyberpunk HUD</option>
            <option value="vinyl">Spinning Vinyl Deck</option>
            <option value="pill">Floating Pill</option>
            <option value="minimal">Minimalist Neon Bar</option>
          </select>
        </div>
        <div class="field">
          <label>Font Family</label>
          <select id="fontFamily" onchange="saveAndSync()">
            <option value="'Outfit', sans-serif">Outfit (Modern)</option>
            <option value="'Inter', sans-serif">Inter (Clean UI)</option>
            <option value="'Orbitron', sans-serif">Orbitron (Sci-Fi)</option>
            <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Primary Accent</label>
          <input type="color" id="accent" value="#00f2fe" onchange="saveAndSync()" />
        </div>
        <div class="field">
          <label>Secondary Accent</label>
          <input type="color" id="accent2" value="#4facfe" onchange="saveAndSync()" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Text Primary</label>
          <input type="color" id="textMain" value="#ffffff" onchange="saveAndSync()" />
        </div>
        <div class="field">
          <label>Text Subtitle</label>
          <input type="color" id="textSub" value="#a0aec0" onchange="saveAndSync()" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Player Width (px)</label>
          <input type="number" id="playerWidth" min="360" max="800" value="520" onchange="saveAndSync()" />
        </div>
        <div class="field">
          <label>Artwork Size (px)</label>
          <input type="number" id="artSize" min="64" max="150" value="104" onchange="saveAndSync()" />
        </div>
      </div>
    </div>

    <!-- 5. API Endpoints & Streamer.bot Settings -->
    <div class="card">
      <div class="card-title"><span>5. API Servers & Streamer.bot</span></div>

      <div class="field">
        <label>CodeMathis YouTube Music API Server URL</label>
        <input type="text" id="ytmUrl" value="http://127.0.0.1:26538/api/v1/song" onchange="saveAndSync()" />
      </div>

      <div class="field">
        <label>nuttylmao SMTC Bridge URL</label>
        <input type="text" id="smtcUrl" value="http://127.0.0.1:5000/now-playing" onchange="saveAndSync()" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Source Priority</label>
          <select id="sourcePriority" onchange="saveAndSync()">
            <option value="auto">Auto-Detect Active</option>
            <option value="ytm">YouTube Music Only</option>
            <option value="smtc">SMTC Bridge Only</option>
          </select>
        </div>
        <div class="field">
          <label>Streamer.bot Action</label>
          <input type="text" id="streamerBotActionName" value="AnnounceTrackChange" onchange="saveAndSync()" />
        </div>
      </div>
    </div>
  </aside>

  <!-- Right Live Preview & OBS URL Exporter -->
  <main class="preview-pane">
    <div class="preview-toolbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <strong style="font-size:14px;">Live Overlay Preview</strong>
        <span style="font-size:12px; color:var(--muted);">Changes sync instantaneously</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" onclick="simulateMockTrack('YTM')">Simulate YouTube Music Track</button>
        <button class="btn" onclick="simulateMockTrack('SPOTIFY')">Simulate Spotify Track</button>
        <button class="btn btn-secondary" onclick="testEffect('TEST_SPLASH_EFFECT', 'splashInEffect')">Trigger 10s Song Splash</button>
        <button class="btn btn-secondary" onclick="testEffect('TEST_OUT_EFFECT', 'outEffect')">Simulate 10s Idle Hide</button>
      </div>
    </div>

    <div class="preview-canvas">
      <iframe id="preview-frame" src="overlay.html"></iframe>
    </div>

    <div class="url-box">
      <label>OBS Browser Source URL (Copy & paste into OBS — embeds all settings & blocked .exe rules):</label>
      <div class="url-row">
        <input type="text" id="obs-url-output" readonly />
        <button class="btn" onclick="copyObsUrl()">Copy OBS URL</button>
      </div>
    </div>
  </main>

<script>
const EFFECT_FAMILIES = [
  "Slide", "Flip3D", "Elastic", "Zoom", "Glitch", "Rotate",
  "SkewWhip", "Origami", "BlurFocus", "PortalClip", "CyberNeon", "GravityDrop"
];
const EFFECT_VARIANTS = [
  "Left", "Right", "Up", "Down", "TopLeft", "TopRight", "BottomLeft", "BottomRight", "CenterPulse"
];

const EFFECTS_LIST = [{ id: "random", name: "🎲 Random Effect Every Time (108 Pool)" }];
EFFECT_FAMILIES.forEach((fam, fIdx) => {
  EFFECT_VARIANTS.forEach((variant, vIdx) => {
    const num = fIdx * 9 + vIdx + 1;
    EFFECTS_LIST.push({
      id: `${fam}_${variant}`,
      name: `${num}. ${fam} — ${variant}`
    });
  });
});

const DEFAULT_CONFIG = {
  ytmUrl: "http://127.0.0.1:26538/api/v1/song",
  smtcUrl: "http://127.0.0.1:5000/now-playing",
  sourcePriority: "auto",
  pollIntervalMs: 1000,
  hideDelaySec: 10,
  splashDurationSec: 10,
  enableSplash: true,
  inEffect: "Elastic_Up",
  outEffect: "Slide_Down",
  splashInEffect: "CyberNeon_CenterPulse",
  splashOutEffect: "BlurFocus_CenterPulse",
  blockedExes: ["chrome.exe", "msedge.exe", "firefox.exe", "brave.exe", "opera.exe", "discord.exe", "obs64.exe"],
  theme: "glass",
  accent: "#00f2fe",
  accent2: "#4facfe",
  bgPrimary: "rgba(13, 15, 22, 0.88)",
  bgSecondary: "rgba(25, 28, 42, 0.95)",
  textMain: "#ffffff",
  textSub: "#a0aec0",
  fontFamily: "'Outfit', sans-serif",
  playerWidth: 520,
  playerHeight: 140,
  artSize: 104,
  borderRadius: 18,
  animDuration: 750,
  showProgress: true,
  streamerBotActionName: "AnnounceTrackChange"
};

let config = { ...DEFAULT_CONFIG };
const bc = new BroadcastChannel("zed_music_overlay_channel");

function populateEffectDropdowns() {
  ["inEffect", "outEffect", "splashInEffect", "splashOutEffect"].forEach(selectId => {
    const sel = document.getElementById(selectId);
    sel.innerHTML = "";
    EFFECTS_LIST.forEach(eff => {
      const opt = document.createElement("option");
      opt.value = eff.id;
      opt.textContent = eff.name;
      sel.appendChild(opt);
    });
  });
}

function renderBlockedExes() {
  const container = document.getElementById("exe-tags-container");
  container.innerHTML = "";
  (config.blockedExes || []).forEach((exe, idx) => {
    const chip = document.createElement("span");
    chip.className = "exe-chip";
    chip.innerHTML = `${exe} <button onclick="removeBlockedExe(${idx})" title="Remove">×</button>`;
    container.appendChild(chip);
  });
}

function addBlockedExe() {
  const input = document.getElementById("new-exe-input");
  const val = input.value.trim().toLowerCase();
  if (val && !config.blockedExes.includes(val)) {
    config.blockedExes.push(val);
    input.value = "";
    renderBlockedExes();
    saveAndSync();
  }
}

function quickAddExe(exeName) {
  if (!config.blockedExes.includes(exeName)) {
    config.blockedExes.push(exeName);
    renderBlockedExes();
    saveAndSync();
  }
}

function removeBlockedExe(idx) {
  config.blockedExes.splice(idx, 1);
  renderBlockedExes();
  saveAndSync();
}

function readFormIntoConfig() {
  config.inEffect = document.getElementById("inEffect").value;
  config.outEffect = document.getElementById("outEffect").value;
  config.splashInEffect = document.getElementById("splashInEffect").value;
  config.splashOutEffect = document.getElementById("splashOutEffect").value;
  config.hideDelaySec = Number(document.getElementById("hideDelaySec").value) || 10;
  config.animDuration = Number(document.getElementById("animDuration").value) || 750;
  config.splashDurationSec = Number(document.getElementById("splashDurationSec").value) || 10;
  config.enableSplash = document.getElementById("enableSplash").value === "true";
  config.theme = document.getElementById("theme").value;
  config.fontFamily = document.getElementById("fontFamily").value;
  config.accent = document.getElementById("accent").value;
  config.accent2 = document.getElementById("accent2").value;
  config.textMain = document.getElementById("textMain").value;
  config.textSub = document.getElementById("textSub").value;
  config.playerWidth = Number(document.getElementById("playerWidth").value) || 520;
  config.artSize = Number(document.getElementById("artSize").value) || 104;
  config.ytmUrl = document.getElementById("ytmUrl").value.trim();
  config.smtcUrl = document.getElementById("smtcUrl").value.trim();
  config.sourcePriority = document.getElementById("sourcePriority").value;
  config.streamerBotActionName = document.getElementById("streamerBotActionName").value.trim();
}

function writeConfigToForm() {
  document.getElementById("inEffect").value = config.inEffect;
  document.getElementById("outEffect").value = config.outEffect;
  document.getElementById("splashInEffect").value = config.splashInEffect;
  document.getElementById("splashOutEffect").value = config.splashOutEffect;
  document.getElementById("hideDelaySec").value = config.hideDelaySec;
  document.getElementById("animDuration").value = config.animDuration;
  document.getElementById("splashDurationSec").value = config.splashDurationSec;
  document.getElementById("enableSplash").value = String(config.enableSplash);
  document.getElementById("theme").value = config.theme;
  document.getElementById("fontFamily").value = config.fontFamily;
  document.getElementById("accent").value = config.accent;
  document.getElementById("accent2").value = config.accent2;
  document.getElementById("textMain").value = config.textMain;
  document.getElementById("textSub").value = config.textSub;
  document.getElementById("playerWidth").value = config.playerWidth;
  document.getElementById("artSize").value = config.artSize;
  document.getElementById("ytmUrl").value = config.ytmUrl;
  document.getElementById("smtcUrl").value = config.smtcUrl;
  document.getElementById("sourcePriority").value = config.sourcePriority;
  document.getElementById("streamerBotActionName").value = config.streamerBotActionName;
  renderBlockedExes();
}

function saveAndSync() {
  readFormIntoConfig();
  localStorage.setItem("zed_music_overlay_config", JSON.stringify(config));
  bc.postMessage({ type: "CONFIG_UPDATE", config });
  updateObsUrlBox();
}

function updateObsUrlBox() {
  const baseUrl = window.location.href.replace(/customizer\.html.*$/i, "overlay.html");
  const encoded = btoa(JSON.stringify(config));
  document.getElementById("obs-url-output").value = `${baseUrl}?cfg=${encoded}`;
}

function copyObsUrl() {
  const input = document.getElementById("obs-url-output");
  input.select();
  navigator.clipboard.writeText(input.value);
}

function testEffect(type, selectId) {
  const effectId = document.getElementById(selectId).value;
  bc.postMessage({ type, effectId });
}

let mockCounter = 1;
function simulateMockTrack(platform) {
  mockCounter++;
  const mockTracks = [
    {
      title: "After Dark (Synthwave VIP)",
      artist: "Mr.Kitty",
      art: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=80"
    },
    {
      title: "Cybernetic Horizon",
      artist: "Kavinsky & The Midnight",
      art: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80"
    },
    {
      title: "Starboy (Live Arena Mix)",
      artist: "The Weeknd ft. Daft Punk",
      art: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=80"
    }
  ];
  const pick = mockTracks[mockCounter % mockTracks.length];
  bc.postMessage({
    type: "SIMULATE_TRACK",
    track: {
      id: `${platform}::${pick.title}::${mockCounter}`,
      title: pick.title,
      artist: pick.artist,
      art: pick.art,
      elapsed: 48,
      duration: 215,
      isPlaying: true,
      platform,
      platformFull: platform === "YTM" ? "YouTube Music" : "Spotify",
      url: platform === "YTM"
        ? "https://music.youtube.com/watch?v=dQw4w9WgXcQ"
        : `https://open.spotify.com/search/${encodeURIComponent(pick.artist + " " + pick.title)}`
    }
  });
}

function resetDefaults() {
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  writeConfigToForm();
  saveAndSync();
}

// Initialize Customizer
populateEffectDropdowns();
try {
  const saved = localStorage.getItem("zed_music_overlay_config");
  if (saved) config = { ...config, ...JSON.parse(saved) };
} catch (e) {}
writeConfigToForm();
updateObsUrlBox();
setTimeout(() => simulateMockTrack("YTM"), 600);
</script>
</body>
</html>
